# Builds the site from content/*.json + static/ and publishes it to GitHub Pages
# on every push to main (including saves from the admin panel at /admin/).
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install image optimizer (cloud only)
        run: npm install --no-save --no-audit --no-fund sharp@0.33.5
      - name: Build
        env:
          SELFHOST_FONTS: "1"
        run: node tools/build.mjs
      - name: Check internal links
        run: node tools/check-links.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
